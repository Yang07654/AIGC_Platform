<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>机型库管理 Demo</title>
  <style>
    *{box-sizing:border-box} :root{--bg:#0f1115;--panel:#181a1f;--line:#2b2f37;--text:#edf1f7;--muted:#8d96a5;--primary:#4f8df7;--danger:#ff7783}
    html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)} button,input,select{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:172px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;padding:14px 12px;display:flex;flex-direction:column;color:#b9c0cb;background:#121419;border-right:1px solid var(--line);font-size:13px}
    .brand{height:56px;margin:0 -12px 10px;padding:0 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);white-space:nowrap}.brand svg{width:28px;height:28px;flex:0 0 auto;display:block}.brand span{color:#f1f4f8;font-size:15px;font-weight:700;letter-spacing:.2px}
    .nav-title{margin:14px 10px 6px;color:#747d8b;font-size:11px}.nav{width:100%;min-height:38px;margin:2px 0;padding:0 11px;display:flex;align-items:center;gap:11px;border:0;border-radius:6px;color:#b9c0cb;background:transparent;text-decoration:none;font-size:13px}.nav:hover{color:#fff;background:#1b1e24}.nav.active{color:#fff;background:#292c33;font-weight:600}.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
    .main{min-width:0}.content{padding:0 20px 38px}.path{height:48px;display:flex;align-items:center;color:#7f8897;border-bottom:1px solid var(--line);font-size:12px}
    .product-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0 16px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0}.btn{height:38px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #343841;border-radius:7px;color:#eef1f6;background:#202229}.btn:hover{background:#292d35}.btn.primary{color:#fff;background:var(--primary);border-color:var(--primary)}
    .menu-wrap{position:relative}.menu{position:absolute;top:44px;right:0;z-index:10;width:150px;padding:6px;display:none;border:1px solid #343841;border-radius:8px;background:#1b1e24;box-shadow:0 12px 28px rgba(0,0,0,.35)}.menu.open{display:block}.menu button{width:100%;height:36px;padding:0 10px;border:0;border-radius:5px;color:#e6eaf0;background:transparent;text-align:left}.menu button:hover{background:#282c34}.menu button.danger{color:var(--danger)}.menu button:disabled{opacity:.38;cursor:not-allowed}
    .toolbar{min-width:0;display:flex;align-items:center;gap:10px;margin:0}.search{width:340px;height:38px;padding:0 12px;display:flex;align-items:center;gap:8px;border:1px solid #343841;border-radius:7px;background:#1e2026}.search svg{width:16px;height:16px;fill:none;stroke:#8c95a4;stroke-width:1.8}.search input{min-width:0;flex:1;border:0;outline:0;color:#edf1f7;background:transparent}.search input::placeholder{color:#737c8a}.select{height:38px;min-width:120px;padding:0 12px;border:1px solid #343841;border-radius:7px;color:#edf1f7;background:#1e2026}.select option{background:#202229}
    .table-wrap{overflow-x:auto;border:1px solid #2d3139;border-radius:9px;background:var(--panel)} table{width:100%;min-width:1280px;border-collapse:collapse;table-layout:fixed}th{height:44px;padding:0 14px;color:#8d97a7;background:#15171b;font-size:12px;font-weight:500;text-align:left}td{height:82px;padding:10px 14px;border-top:1px solid #2d3139;color:#e6eaf0;font-size:13px}tbody tr:hover{background:#1d2026}th:last-child,td:last-child{position:sticky;right:0;z-index:2;background:#181a1f;box-shadow:-10px 0 16px rgba(10,12,16,.55)}th:last-child{z-index:3;background:#15171b}.check{width:15px;height:15px;accent-color:var(--primary)}.id{color:#9da6b4;font-size:12px}.pictures{display:flex;gap:4px;align-items:center}.pictures img{width:52px;height:44px;border:1px solid #30343c;border-radius:6px;object-fit:cover}.count{min-width:28px;height:24px;display:grid;place-items:center;margin-left:2px;border-radius:12px;color:#aeb7c5;background:#292d35;font-size:11px}.row-actions{display:flex;gap:12px}.link{padding:0;border:0;color:#6ea1ff;background:transparent;font-size:12px}.link:hover{text-decoration:underline}.link.danger{color:var(--danger)}
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:14px;color:#9099a8;font-size:12px}.pagination button,.pagination select{height:34px;border:1px solid #343841;border-radius:6px;color:#dfe4eb;background:#1d2026}.pagination button{width:36px}.pagination button:disabled{opacity:.38;cursor:not-allowed}.pagination select{padding:0 10px}.empty{padding:34px;text-align:center;color:#7f8998}
    .backdrop{position:fixed;inset:0;z-index:40;opacity:0;pointer-events:none;background:rgba(4,6,9,.64);transition:.18s}.backdrop.open{opacity:1;pointer-events:auto}.modal{position:fixed;z-index:50;left:50%;top:50%;width:620px;max-width:calc(100vw - 30px);max-height:calc(100vh - 40px);overflow:auto;border-radius:12px;color:var(--text);background:var(--panel);box-shadow:0 18px 46px rgba(0,0,0,.48);transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;visibility:hidden;transition:.18s}.modal.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;visibility:visible}.modal-head,.modal-foot{display:flex;align-items:center;border-color:var(--line)}.modal-head{justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:18px}.close{border:0;color:#c8cbd1;background:transparent;font-size:22px}.modal-body{padding:22px}.modal-foot{justify-content:flex-end;gap:9px;padding:15px 22px;border-top:1px solid var(--line)}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:13px}.field input,.field select{width:100%;height:39px;padding:0 11px;border:1px solid #343841;border-radius:7px;outline:0;color:#eef1f6;background:#202229}.upload{min-height:110px;display:grid;place-items:center;text-align:center;border:1px dashed #536078;border-radius:8px;color:#8f99a8;background:#15171b;cursor:pointer;font-size:12px;line-height:1.8}.upload b{color:#79a8ff}.upload input{display:none}.upload-preview,.drawer-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.thumb{position:relative;width:82px;height:62px}.thumb img,.drawer-gallery img{width:82px;height:62px;border:1px solid #30343c;border-radius:7px;object-fit:cover}.thumb button{position:absolute;top:4px;right:4px;width:20px;height:20px;padding:0;border:0;border-radius:50%;color:#fff;background:rgba(10,12,16,.8)}
    .drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(600px,92vw);overflow:auto;color:var(--text);background:var(--panel);box-shadow:-16px 0 44px rgba(0,0,0,.4);transform:translateX(102%);transition:.2s}.drawer.open{transform:none}.drawer-head{position:sticky;top:0;z-index:2;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--panel)}.drawer-head h2{margin:0;font-size:17px}.drawer-body{padding:22px}.drawer-gallery{margin:0 0 18px}.drawer-gallery img{width:calc(50% - 4px);height:150px}.detail-title{display:flex;align-items:center;justify-content:space-between}.detail-title h3{margin:0;font-size:19px}.section{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.section h4{margin:0 0 14px}.kv{margin:11px 0;display:grid;grid-template-columns:100px 1fr;gap:12px;font-size:13px}.kv span:first-child{color:var(--muted)}.drawer-edit{display:none}.drawer.editing .drawer-view{display:none}.drawer.editing .drawer-edit{display:block}.drawer-actions{position:sticky;bottom:0;margin:24px -22px -22px;padding:15px 22px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);background:var(--panel)}
    .confirm{width:420px}.confirm .modal-body{color:var(--muted);line-height:1.65}.confirm strong{display:block;margin-bottom:6px;color:var(--text)}.confirm-danger{color:#fff;background:#d64d5b;border-color:#d64d5b}.toast{position:fixed;left:50%;bottom:28px;z-index:80;padding:11px 16px;border-radius:8px;color:#fff;background:#252830;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translate(-50%,18px);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    /* 与风格库统一紧凑排版：字号、控件高度、页面留白和表格行距保持一致。 */
    .product-topbar{height:44px;min-height:44px;margin:14px 0 10px;padding:0;gap:12px}
    .content{font-size:13px}.toolbar{gap:8px}.actions{gap:8px}
    .btn{height:32px;padding:0 12px;border-radius:5px;font-size:12px;font-weight:550}
    .menu-wrap>#moreToggle{min-width:96px}.actions>.primary{min-width:116px}
    .search{width:min(240px,100%);min-width:240px;flex:0 0 240px;height:32px;padding:0 9px;border-radius:5px;font-size:13px}
    .search input{font-size:12px}
    .select{height:32px;min-width:88px;padding:0 30px 0 9px;border-radius:5px;font-size:12px}.toolbar .select:first-of-type{min-width:111px}
    .menu{top:37px;width:190px;padding:5px;border-radius:7px}.menu button{min-height:35px;height:35px;font-size:12px}
    .table-wrap{border-radius:10px;font-size:13px;scrollbar-width:thin;scrollbar-color:#424852 transparent}.table-wrap:hover{scrollbar-color:#68717e transparent}.table-wrap::-webkit-scrollbar{height:8px}.table-wrap::-webkit-scrollbar-track{background:transparent}.table-wrap::-webkit-scrollbar-thumb{min-width:48px;border:2px solid transparent;border-radius:999px;background:#424852;background-clip:padding-box}.table-wrap:hover::-webkit-scrollbar-thumb{background:#68717e;background-clip:padding-box}.table-wrap::-webkit-scrollbar-thumb:hover{background:#818b99;background-clip:padding-box}.table-wrap::-webkit-scrollbar-corner{background:transparent}
    th{height:39px;padding:0 14px}
    td{height:70.8px;padding:10px 14px}
    .pagination{min-height:54px;gap:8px;padding-top:0}
    .pagination button{width:30px;height:30px;border-radius:5px;font-size:18px;line-height:1}
    .pagination select{height:30px;padding:0 26px 0 9px;border-radius:5px}
    #pageCurrent{min-width:48px;text-align:center;color:#c8ced7}
    .drawer{width:min(560px,92vw);font-size:13px}.drawer-head{font-size:13px}.drawer-head h2{font-weight:620}.drawer-body{font-size:13px}
    .field input,.field select{border-radius:8px}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,141,247,.12)}
    .modal{border-radius:13px;font-size:13px}.modal-head{padding:19px 22px}.modal-foot{padding:16px 22px}.modal .btn,.drawer .btn{height:38px;padding:0 15px;border-radius:8px;font-size:13px;font-weight:400}.field label.upload{min-height:92px;border-radius:9px;font-size:12px;line-height:normal}.confirm .modal-body strong{font-size:15px}
    @media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand span,.nav span{display:none}.brand,.nav{justify-content:center}.content{padding-left:16px;padding-right:16px}.product-topbar{height:auto;align-items:flex-start;flex-wrap:wrap}.toolbar{flex-wrap:wrap}.product-search{width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="#0c5a68"/><ellipse cx="26" cy="22" rx="10.5" ry="17" fill="#17191d"/><path d="M26 5a17 17 0 0 1 0 34c6.2-3.4 9.3-9.1 9.3-17S32.2 8.4 26 5Z" fill="#20798c"/></svg><span>OLIGHT AIGC</span></div>
      <div class="nav-title">素材管理</div>
      <a class="nav active" href="product-library.html"><svg viewBox="0 0 24 24"><path d="M4.5 7.7 12 3.5l7.5 4.2v8.6L12 20.5l-7.5-4.2Z"/><path d="m4.8 7.8 7.2 4.1 7.2-4.1M12 12v8.1"/><path d="m8.3 5.6 7.4 4.2"/></svg><span>产品库</span></a>
      <a class="nav" href="index.html"><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17h1.2a1.8 1.8 0 0 0 0-3.6h-.7a1.6 1.6 0 0 1 0-3.2H15a5.5 5.5 0 0 0 5.5-5.5c0-2.8-3.7-4.7-8.5-4.7Z"/><circle cx="7.8" cy="10" r=".8"/><circle cx="10" cy="7" r=".8"/><circle cx="14" cy="6.8" r=".8"/><circle cx="17" cy="9" r=".8"/></svg><span>风格库</span></a>
    </aside>
    <main class="main"><div class="content">
      <div class="path">素材管理&nbsp;&nbsp;/&nbsp;&nbsp;机型库</div>
      <div class="product-topbar"><div class="toolbar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg><input id="search" placeholder="搜索机型名称、ID、创建人、修改人"></label><select class="select" id="sort"><option value="newest">最新创建</option><option value="updated">最近更新</option></select><select class="select" id="scope"><option value="all">全部范围</option><option value="team">团队可见</option><option value="personal">仅自己</option></select></div><div class="actions"><div class="menu-wrap"><button class="btn" id="moreToggle">更多　⌄</button><div class="menu" id="moreMenu"><button id="importProduct">导入</button><button id="exportProduct">导出</button><button class="danger" id="batchDelete" disabled>批量删除</button></div></div><button class="btn primary" id="createProduct">＋ 新增</button></div></div>
      <div class="table-wrap"><table><colgroup><col style="width:44px"><col style="width:120px"><col style="width:170px"><col style="width:230px"><col style="width:110px"><col style="width:100px"><col style="width:165px"><col style="width:100px"><col style="width:165px"><col style="width:140px"></colgroup><thead><tr><th><input class="check" id="selectAll" type="checkbox"></th><th>ID</th><th>机型名称</th><th>图片</th><th>可见范围</th><th>创建人</th><th>创建时间</th><th>修改人</th><th>最近更新</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
      <div class="pagination"><span id="total"></span><select id="pageSize"><option value="5">5 条/页</option><option value="10">10 条/页</option></select><button id="prev">‹</button><span id="pageCurrent"></span><button id="next">›</button></div>
    </div></main>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer"><div class="drawer-head"><h2 id="drawerTitle">机型详情</h2><button class="close" id="closeDrawer">×</button></div><div class="drawer-body"><div class="drawer-view"><div class="drawer-gallery" id="detailGallery"></div><div class="detail-title"><h3 id="detailName"></h3><button class="btn" id="editFromDetail">编辑</button></div><div class="section"><h4>基础信息</h4><div class="kv"><span>ID</span><span id="detailId"></span></div><div class="kv"><span>可见范围</span><span id="detailScope"></span></div><div class="kv"><span>创建人</span><span id="detailCreator"></span></div><div class="kv"><span>创建时间</span><span id="detailCreated"></span></div><div class="kv"><span>修改人</span><span id="detailModifier"></span></div><div class="kv"><span>最近更新</span><span id="detailUpdated"></span></div></div></div><div class="drawer-edit"><div class="field"><label for="drawerName">机型名称</label><input id="drawerName" placeholder="请输入机型名称"></div><div class="field"><label for="drawerScope">可见范围</label><select id="drawerScope"><option value="team">团队可见</option><option value="personal">仅自己</option></select></div><div class="field"><label>创建人</label><input id="drawerCreator" disabled></div><div class="field"><label>机型图片</label><label class="upload" for="drawerImages"><div><b>＋ 选择图片</b><br>支持上传多张图片</div><input id="drawerImages" type="file" accept="image/*" multiple></label><div class="upload-preview" id="drawerPreview"></div></div><div class="drawer-actions"><button class="btn" id="cancelDrawerEdit">取消</button><button class="btn primary" id="saveDrawerEdit">确认</button></div></div></div></aside>
  <section class="modal" id="productModal"><div class="modal-head"><h2 id="modalTitle">新增机型</h2><button class="close" id="closeModal">×</button></div><div class="modal-body"><div class="field"><label for="name">机型名称</label><input id="name" placeholder="请输入机型名称"></div><div class="field"><label for="modalScope">可见范围</label><select id="modalScope"><option value="team">团队可见</option><option value="personal">仅自己</option></select></div><div class="field"><label>机型图片</label><label class="upload" for="images"><div><b>＋ 选择图片</b><br>支持上传多张图片</div><input id="images" type="file" accept="image/*" multiple></label><div class="upload-preview" id="preview"></div></div></div><div class="modal-foot"><button class="btn" id="cancelModal">取消</button><button class="btn primary" id="save">确认</button></div></section>
  <section class="modal confirm" id="confirm"><div class="modal-head"><h2>确认删除</h2><button class="close" id="closeConfirm">×</button></div><div class="modal-body"><strong id="confirmHeadline"></strong><span id="confirmMessage"></span></div><div class="modal-foot"><button class="btn" id="cancelConfirm">取消</button><button class="btn confirm-danger" id="confirmDelete">确认</button></div></section>
  <div class="toast" id="toast"></div>
  <script>
    const data=[
      {id:'PRO-2026-001',name:'ArkPro',images:['assets/product-library-01.png'],scope:'team',creator:'陈可',created:'2026-06-20 09:12:36',modifier:'李唯',updated:'2026-06-24 17:20:42'},
      {id:'PRO-2026-002',name:'ArkPro Lite',images:['assets/product-library-02.png'],scope:'team',creator:'李唯',created:'2026-06-19 10:25:18',modifier:'陈可',updated:'2026-06-23 16:12:18'},
      {id:'PRO-2026-003',name:'Osight XE AMRS',images:['assets/product-library-03.png'],scope:'team',creator:'系统创建',created:'2026-06-18 14:08:42',modifier:'林默',updated:'2026-06-22 14:35:06'}
    ];
    const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); let page=1,editing=null,active=null,pending=[],deleteAction=null;
    function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>$('toast').classList.remove('show'),1700)}
    function filtered(){const q=$('search').value.trim().toLowerCase(),scope=$('scope').value,sort=$('sort').value;return data.map((item,index)=>({item,index})).filter(({item})=>(scope==='all'||item.scope===scope)&&[item.id,item.name,item.creator,item.modifier].some(v=>v.toLowerCase().includes(q))).sort((a,b)=>(sort==='updated'?b.item.updated.localeCompare(a.item.updated):b.item.created.localeCompare(a.item.created)))}
    function updateBatch(){const count=document.querySelectorAll('.row-check:checked').length;$('batchDelete').disabled=!count}
    function render(){const rows=filtered(),size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);const shown=rows.slice((page-1)*size,page*size);$('body').innerHTML=shown.length?shown.map(({item,index})=>`<tr data-index="${index}"><td><input class="check row-check" type="checkbox"></td><td><span class="id">${esc(item.id)}</span></td><td><strong>${esc(item.name)}</strong></td><td><div class="pictures">${item.images.slice(0,3).map(src=>`<img src="${esc(src)}" alt="${esc(item.name)}机型图片">`).join('')}${item.images.length>3?`<span class="count">+${item.images.length-3}</span>`:''}</div></td><td>${item.scope==='personal'?'仅自己':'团队可见'}</td><td>${esc(item.creator)}</td><td>${item.created}</td><td>${esc(item.modifier)}</td><td>${item.updated}</td><td><div class="row-actions"><button class="link" data-action="detail">详情</button><button class="link" data-action="edit">编辑</button><button class="link danger" data-action="delete">删除</button></div></td></tr>`).join(''):`<tr><td colspan="10"><div class="empty">没有找到匹配的机型</div></td></tr>`;$('total').textContent=`共 ${rows.length} 条`;$('pageCurrent').textContent=`${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('selectAll').checked=false;updateBatch()}
    function openLayer(node){$('backdrop').classList.add('open');node.classList.add('open')}
    function closeLayers(){[$('drawer'),$('productModal'),$('confirm')].forEach(n=>n.classList.remove('open'));$('drawer').classList.remove('editing');$('backdrop').classList.remove('open');deleteAction=null}
    function preview(){ $('preview').innerHTML=pending.map((src,index)=>`<div class="thumb"><img src="${esc(src)}" alt="机型图片"><button type="button" data-remove="${index}">×</button></div>`).join('') }
    function openModal(index=null){editing=index;const item=index===null?null:data[index];$('modalTitle').textContent=item?'编辑机型':'新增机型';$('name').value=item?.name||'';$('modalScope').value=item?.scope||'team';$('images').value='';pending=item?[...item.images]:[];preview();$('drawer').classList.remove('open');openLayer($('productModal'));setTimeout(()=>$('name').focus(),30)}
    function drawerPreview(){ $('drawerPreview').innerHTML=pending.map((src,index)=>`<div class="thumb"><img src="${esc(src)}" alt="机型图片"><button type="button" data-drawer-remove="${index}" aria-label="删除图片">×</button></div>`).join('') }
    function setDrawerEditing(editingMode){const item=data[active];$('drawer').classList.toggle('editing',editingMode);$('drawerTitle').textContent=editingMode?'编辑机型':'机型详情';if(editingMode&&item){$('drawerName').value=item.name;$('drawerScope').value=item.scope;$('drawerCreator').value=item.creator;$('drawerImages').value='';pending=[...item.images];drawerPreview();setTimeout(()=>$('drawerName').focus(),30)}}
    function openDetail(index,editingMode=false){active=index;const item=data[index];$('detailGallery').innerHTML=item.images.map(src=>`<img src="${esc(src)}" alt="${esc(item.name)}机型图片">`).join('');$('detailName').textContent=item.name;$('detailId').textContent=item.id;$('detailScope').textContent=item.scope==='personal'?'仅自己':'团队可见';$('detailCreator').textContent=item.creator;$('detailCreated').textContent=item.created;$('detailModifier').textContent=item.modifier;$('detailUpdated').textContent=item.updated;openLayer($('drawer'));setDrawerEditing(editingMode)}
    function confirmDelete(headline,message,action){deleteAction=action;$('confirmHeadline').textContent=headline;$('confirmMessage').textContent=message;openLayer($('confirm'))}
    $('body').addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(!action)return;const index=Number(action.closest('tr').dataset.index);if(action.dataset.action==='detail')openDetail(index);if(action.dataset.action==='edit')openDetail(index,true);if(action.dataset.action==='delete')confirmDelete('确定要删除该机型吗？',`被删除数据 ID：${data[index].id}。删除后将无法恢复，请谨慎操作。`,()=>{data.splice(index,1);render();toast('机型已删除')})});
    $('body').addEventListener('change',e=>{if(e.target.classList.contains('row-check'))updateBatch()});$('selectAll').addEventListener('change',e=>{document.querySelectorAll('.row-check').forEach(c=>c.checked=e.target.checked);updateBatch()});
    ['search','sort','scope'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=1;render()}));$('pageSize').addEventListener('change',()=>{page=1;render()});$('prev').addEventListener('click',()=>{if(page>1){page--;render()}});$('next').addEventListener('click',()=>{page++;render()});
    $('createProduct').addEventListener('click',()=>openModal());$('images').addEventListener('change',e=>{[...e.target.files].forEach(file=>pending.push(URL.createObjectURL(file)));e.target.value='';preview()});$('preview').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;pending.splice(Number(b.dataset.remove),1);preview()});
    $('save').addEventListener('click',()=>{const name=$('name').value.trim();if(!name)return toast('请输入机型名称');if(!pending.length)return toast('请至少上传一张机型图片');const now='2026-06-24 17:20:42';if(editing===null)data.unshift({id:`PRO-2026-${String(data.length+1).padStart(3,'0')}`,name,images:[...pending],scope:$('modalScope').value,creator:'林默',created:now,modifier:'林默',updated:now});else Object.assign(data[editing],{name,images:[...pending],scope:$('modalScope').value,modifier:'林默',updated:now});const text=editing===null?'机型已新增':'机型已保存';closeLayers();page=1;render();toast(text)});
    $('editFromDetail').addEventListener('click',()=>setDrawerEditing(true));$('cancelDrawerEdit').addEventListener('click',()=>setDrawerEditing(false));$('drawerImages').addEventListener('change',e=>{[...e.target.files].forEach(file=>pending.push(URL.createObjectURL(file)));e.target.value='';drawerPreview()});$('drawerPreview').addEventListener('click',e=>{const b=e.target.closest('[data-drawer-remove]');if(!b)return;pending.splice(Number(b.dataset.drawerRemove),1);drawerPreview()});$('saveDrawerEdit').addEventListener('click',()=>{const name=$('drawerName').value.trim();if(!name)return toast('请输入机型名称');if(!pending.length)return toast('请至少上传一张机型图片');Object.assign(data[active],{name,images:[...pending],scope:$('drawerScope').value,modifier:'林默',updated:'2026-06-24 17:20:42'});render();openDetail(active);toast('机型已保存')});['closeDrawer','closeModal','cancelModal'].forEach(id=>$(id).addEventListener('click',closeLayers));$('backdrop').addEventListener('click',closeLayers);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayers()});
    $('moreToggle').addEventListener('click',e=>{e.stopPropagation();$('moreMenu').classList.toggle('open')});document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))$('moreMenu').classList.remove('open')});$('importProduct').addEventListener('click',()=>toast('请选择机型数据文件进行导入'));$('exportProduct').addEventListener('click',()=>toast(`已导出 ${filtered().length} 条机型数据`));
    $('batchDelete').addEventListener('click',()=>{const indexes=[...document.querySelectorAll('tr[data-index]')].filter(r=>r.querySelector('.row-check')?.checked).map(r=>Number(r.dataset.index));if(!indexes.length)return;const ids=indexes.map(i=>data[i].id);confirmDelete(`确定要删除选中的 ${indexes.length} 条数据吗？`,`被删除数据 ID：${ids.join('、')}。删除后将无法恢复，请谨慎操作。`,()=>{indexes.sort((a,b)=>b-a).forEach(i=>data.splice(i,1));render();toast('选中机型已删除')})});
    ['closeConfirm','cancelConfirm'].forEach(id=>$(id).addEventListener('click',closeLayers));$('confirmDelete').addEventListener('click',()=>{const action=deleteAction;closeLayers();if(action)action()});render();
  </script>
</body>
</html>
